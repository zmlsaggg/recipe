[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-finder"
version = "1.0.0"
description = "A local recipe index builder and interactive search CLI for multiple recipe sites."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]

[project.scripts]
recipe-finder = "recipe:main"

[project.urls]
Homepage = "https://github.com/zmlsaggg/recipe"
Repository = "https://github.com/zmlsaggg/recipe"
Issues = "https://github.com/zmlsaggg/recipe/issues"

[tool.setuptools]
py-modules = ["recipe"]
